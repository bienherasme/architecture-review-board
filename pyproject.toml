[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "architecture-review-board"
version = "0.1.0"
description = "Structured, provider-neutral multi-reviewer architecture assessment system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Bienvenido Herasme" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
]

[project.scripts]
architecture-review-board = "architecture_review_board.cli:main"

[project.optional-dependencies]
openai = [
    "openai>=3.0,<4",
]
mcp = [
    "mcp>=2,<3",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# These import their optional SDK only after pytest.importorskip, so the
# module-level import comes after a statement on purpose.
"tests/providers/test_openai_model.py" = ["E402"]
"tests/providers/test_engineering_knowledge.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
