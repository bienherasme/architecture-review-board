name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core (Python 3.11, no optional providers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install base + dev
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check (core, excludes concrete optional-SDK adapters)
        run: |
          mypy src --strict \
            --exclude '^src/architecture_review_board/providers/openai_model\.py$' \
            --exclude '^src/architecture_review_board/providers/engineering_knowledge\.py$'
      - name: Test
        run: pytest -q

  full:
    name: full (Python 3.13, openai + mcp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install full development environment
        run: pip install -e ".[dev,openai,mcp]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src --strict
      - name: Test
        run: pytest -q
